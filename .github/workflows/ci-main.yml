name: CI/CD (Main)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrations:
    name: Migration Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check for duplicate migration numbers
        run: |
          DUPES=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} \
            | grep -E '^[0-9]+' \
            | sed 's/^\([0-9]*\).*/\1/' \
            | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "ERROR: Duplicate migration numbers found: $DUPES"
            echo "Check supabase/MIGRATION_ORDER.md for the next available number."
            exit 1
          fi
          echo "OK: No duplicate migration numbers."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Typecheck
        run: npm run typecheck

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build Application
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deployed to Production
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - name: Dummy Deployment
        run: |
          echo "Simulating deployment to production..."
          echo "Success! (Visual only)"
